version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["tauri*"]
  - package-ecosystem: npm
    directory: /desktop
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies]
