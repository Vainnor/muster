name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Build jobs run third-party build code (pnpm and cargo build scripts), so they get a
# read-only token and no secrets. The sign job holds the updater signing key and runs only the
# Tauri CLI from the lockfile on the built files; only the publish job, which runs no build
# code, can write the release.
jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS universal, slug: macos, os: macos-latest, args: "--target universal-apple-darwin", rust_targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: Linux x64, slug: linux, os: ubuntu-22.04, args: "", rust_targets: "" }
          - { name: Windows x64, slug: windows, os: windows-latest, args: "", rust_targets: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The Azure mirror sometimes stalls mid-download with the connection open, which
          # apt's own timeouts do not catch; cap each attempt and retry. Retries go to Ubuntu's
          # main archive, since a stalling Azure mirror tends to stall again. Packages already
          # downloaded stay in apt's cache, so each attempt picks up where the last one stopped.
          apt() { sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; }
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            apt update && apt install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed; retrying"
          done
      - name: Extra Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm --dir desktop install --frozen-lockfile
      # No secrets here: the OS installers are unsigned (docs/RELEASING.md), and the updater
      # files are signed in the sign job, so build scripts never see the key.
      - name: Build bundles
        run: pnpm --dir desktop tauri build ${{ matrix.args }} --features updater
      - name: Collect bundles
        shell: bash
        run: |
          mkdir release-assets
          find target -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} release-assets/ \;
          # The macOS updater installs from a .tar.gz of the app bundle.
          app="$(find target -path '*/release/bundle/macos/*' -type d -name '*.app' -prune | head -n 1)"
          if [ -n "$app" ]; then
            tar -C "$(dirname "$app")" -czf "release-assets/Muster_${GITHUB_REF_NAME#v}_universal.app.tar.gz" "$(basename "$app")"
          fi
          ls -l release-assets
          test -n "$(ls release-assets)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign the updater files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The CLI at the lockfile's hash, with no install scripts; nothing else from the repo runs.
      - run: pnpm --dir desktop install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets
      - name: Sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (docs/RELEASING.md § Updater)."
            exit 1
          fi
          mkdir signatures
          # Bound to the version, so a manifest cannot pair a newer number with an older file.
          for file in assets/*.app.tar.gz assets/*.AppImage assets/*-setup.exe; do
            pnpm --dir desktop exec tauri signer sign --app-version "${GITHUB_REF_NAME#v}" "$PWD/$file"
            mv "$file.sig" signatures/
          done
          ls -l signatures
          test "$(ls signatures | wc -l)" = 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the release with checksums
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signatures
          path: assets
      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            jq -n --arg url "$base/$(jq -rn --arg f "$1" '$f | @uri')" --rawfile signature "$1.sig" \
              '{url: $url, signature: $signature}'
          }
          mac="$(entry "$(ls *.app.tar.gz)")"
          linux="$(entry "$(ls *.AppImage)")"
          windows="$(entry "$(ls *-setup.exe)")"
          # The updater looks up "<os>-<arch>-<installer>" first, then "<os>-<arch>". Only the
          # installs that update without admin rights are listed.
          jq -n --arg version "${TAG#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson mac "$mac" --argjson linux "$linux" --argjson windows "$windows" \
            '{version: $version, notes: "See the release page for what changed.", pub_date: $date,
              platforms: {
                "darwin-aarch64": $mac, "darwin-x86_64": $mac,
                "darwin-aarch64-app": $mac, "darwin-x86_64-app": $mac,
                "linux-x86_64": $linux, "linux-x86_64-appimage": $linux,
                "windows-x86_64": $windows, "windows-x86_64-nsis": $windows}}' > latest.json
          cat latest.json
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Muster $TAG" \
            --notes "The installers are not code-signed. See docs/RELEASING.md#unsigned-builds before opening one, and verify downloads against SHA256SUMS.txt." \
            -- *
