name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# Build jobs run third-party build code (pnpm and cargo build scripts), so they get a
# read-only token. Only the publish job, which runs no build code, can write the release.
jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS universal, slug: macos, os: macos-latest, args: "--target universal-apple-darwin", rust_targets: "aarch64-apple-darwin x86_64-apple-darwin" }
          - { name: Linux x64, slug: linux, os: ubuntu-22.04, args: "", rust_targets: "" }
          - { name: Windows x64, slug: windows, os: windows-latest, args: "", rust_targets: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The Azure mirror sometimes stalls mid-download with the connection open, which
          # apt's own timeouts do not catch; cap each attempt and retry.
          apt() { sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; }
          for attempt in 1 2 3; do
            apt update && apt install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed; retrying"
          done
      - name: Extra Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm --dir desktop install --frozen-lockfile
      # No signing secrets are passed: builds are unsigned (docs/RELEASING.md).
      - name: Build bundles
        run: pnpm --dir desktop tauri build ${{ matrix.args }}
      - name: Collect bundles
        shell: bash
        run: |
          mkdir release-assets
          find target -path '*/release/bundle/*' -type f \( -name '*.dmg' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} release-assets/ \;
          ls -l release-assets
          test -n "$(ls release-assets)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundles-${{ matrix.slug }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft the release with checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundles-*
          merge-multiple: true
          path: assets
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Muster $TAG" \
            --notes "Unsigned preview build. See docs/RELEASING.md#unsigned-builds before opening it, and verify downloads against SHA256SUMS.txt." \
            -- *
