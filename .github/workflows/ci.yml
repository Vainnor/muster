name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: topcoat-cli@0.10.0
      - run: topcoat fmt --check web/src

  rust:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          # The Azure mirror sometimes stalls mid-download with the connection open, which
          # apt's own timeouts do not catch; cap each attempt and retry. Retries go to Ubuntu's
          # main archive, since a stalling Azure mirror tends to stall again. Packages already
          # downloaded stay in apt's cache, so each attempt picks up where the last one stopped.
          apt() { sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; }
          for attempt in 1 2 3; do
            if [ "$attempt" != 1 ] && [ -f /etc/apt/apt-mirrors.txt ]; then
              echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            apt update && apt install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev && break
            [ "$attempt" = 3 ] && exit 1
            echo "apt attempt $attempt failed; retrying"
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      # The desktop crate embeds desktop/dist at compile time.
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop build
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p muster-desktop --all-targets --features updater --locked -- -D warnings
      - run: cargo test --workspace --locked

  frontend:
    name: Desktop UI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop typecheck
      - run: pnpm --dir desktop test
      - run: pnpm --dir desktop build
      - run: pnpm --dir desktop audit --audit-level=high

  supply-chain:
    name: cargo-deny and cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check
      # Fails on vulnerabilities; unmaintained/unsound notices print as warnings and are
      # triaged in deny.toml.
      - run: cargo audit
