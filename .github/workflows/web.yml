name: Website image

on:
  push:
    branches: [main]
    paths: [web/**, crates/**, themes/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, crates/**, themes/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/web.yml]

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

# The build job runs third-party build code (cargo build scripts inside the Dockerfile), so it
# gets a read-only token. Only the publish job, which runs no build code, can push the image.
jobs:
  image:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: muster-web:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/muster-web.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: muster-web-image
          path: ${{ runner.temp }}/muster-web.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Push to ghcr.io
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: muster-web-image
          path: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ghcr.io/vainnor/muster-web
          RUN: ${{ github.run_number }}
        run: |
          short="${GITHUB_SHA::7}"
          docker load --input "$RUNNER_TEMP/muster-web.tar"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          for tag in main "sha-$short" "main-$RUN"; do
            docker tag muster-web:ci "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:main")"
          echo "Pushed $digest (tags main, sha-$short, main-$RUN)" | tee -a "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
