name: Website image

on:
  push:
    branches: [main]
    paths: [web/**, crates/**, themes/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, crates/**, themes/**, Cargo.toml, Cargo.lock, rust-toolchain.toml, .github/workflows/web.yml]

permissions: {}

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build only. Pushing to a registry and deploying are not part of this workflow.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: muster-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
