[package]
name = "muster-desktop"
description = "Muster's Tauri v2 desktop shell: window, tray, single instance, and the commands the UI calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "muster"

[[bin]]
name = "muster"
path = "src/main.rs"

[lib]
name = "muster_desktop"
path = "src/lib.rs"


[features]
# Opt-in auto-update support. Off by default; see docs/RELEASING.md § Updater.
updater = ["dep:tauri-plugin-updater"]

[dependencies]
muster-core.workspace = true
muster-ui.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-dialog = "=2.8.1"
# No `zip` feature: it only handles legacy zipped Windows updates and pulls in zip 4.x
# (RUSTSEC-2026-0367/0368/0369). Updates ship as plain .exe/.msi/AppImage (Tauri v2 format).
tauri-plugin-updater = { version = "2.14", optional = true, default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
# The start-on-login Run value (src/autostart.rs). Microsoft's safe wrapper over the registry.
windows-registry = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Lists processes (pid, exe, arguments, owner) when the user closes a group (src/processes.rs).
# Linux reads /proc instead: sysinfo raises RLIMIT_NOFILE for the whole process there, and
# every app Muster starts afterwards would inherit it.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
# Safe kill(2) for closing a group.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
# A polite quit for apps (the same as choosing Quit), which a signal is not.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[lints]
workspace = true
