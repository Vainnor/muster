apiVersion: apps/v1
kind: Deployment
metadata:
  name: muster-web
  labels: { app.kubernetes.io/name: muster-web }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: muster-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: muster-web }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/vainnor/muster-web
          ports:
            - { name: http, containerPort: 8080 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /theme.css, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /theme.css, port: http }
            periodSeconds: 30
