[workspace]
resolver = "3"
members = [
  "crates/muster-core",
  "crates/muster-ui",
  "desktop/src-tauri",
  # "web",
]
default-members = ["crates/muster-core", "crates/muster-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Vainnor"]
license = "MIT"
repository = "https://github.com/Vainnor/muster"
homepage = "https://muster.vainnor.com"
publish = false

[workspace.dependencies]
muster-core = { path = "crates/muster-core" }
muster-ui = { path = "crates/muster-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tempfile = "3.27"
tracing = "0.1.44"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
